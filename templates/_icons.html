{# Iconos de trazo (24x24). Uso: {{ icon('home') }} #}
{% macro icon(name, cls='') -%}
<svg class="ico {{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'home' -%}
  <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>
{%- elif name == 'back' -%}
  <path d="M15 5l-7 7 7 7"/>
{%- elif name == 'chevron' -%}
  <path d="M9 5l7 7-7 7"/>
{%- elif name == 'mapa' -%}
  <circle cx="12" cy="4.5" r="2"/><path d="M6 8.5h12"/><path d="M12 8.5v6"/><path d="M12 14.5l-3 6.5"/><path d="M12 14.5l3 6.5"/><path d="M6 8.5 4.5 14"/><path d="M18 8.5l1.5 5.5"/>
{%- elif name == 'patologias' -%}
  <rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M12 9v6"/><path d="M9 12h6"/>
{%- elif name == 'ortopedia' -%}
  <path d="M8.2 8.2l7.6 7.6"/><circle cx="7" cy="5" r="2.1"/><circle cx="5" cy="7" r="2.1"/><circle cx="19" cy="17" r="2.1"/><circle cx="17" cy="19" r="2.1"/>
{%- elif name == 'dermatologia' -%}
  <path d="M3 9c3-2 6 2 9 0s6-2 9 0"/><path d="M3 14c3-2 6 2 9 0s6-2 9 0"/><path d="M3 19c3-2 6 2 9 0s6-2 9 0"/>
{%- elif name == 'estetica' -%}
  <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>
{%- elif name == 'urogenital' -%}
  <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9"/><path d="M7.5 12h9"/>
{%- elif name == 'wave' -%}
  <path d="M2 12h4l2-6 3 12 3-9 2 3h6"/>
{%- elif name == 'zone' -%}
  <circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
{%- elif name == 'probe' -%}
  <path d="M14 3l7 7-3 3-7-7z"/><path d="M11 6 4.5 12.5a3 3 0 0 0 0 4.2l2.8 2.8a3 3 0 0 0 4.2 0L18 13"/>
{%- elif name == 'clock' -%}
  <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
{%- elif name == 'play' -%}
  <path d="M7 4.5v15l12.5-7.5z" fill="currentColor" stroke="none"/>
{%- elif name == 'pause' -%}
  <rect x="6" y="4.5" width="4" height="15" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4.5" width="4" height="15" rx="1" fill="currentColor" stroke="none"/>
{%- elif name == 'stop' -%}
  <rect x="5.5" y="5.5" width="13" height="13" rx="2" fill="currentColor" stroke="none"/>
{%- elif name == 'reset' -%}
  <path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/>
{%- elif name == 'info' -%}
  <circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><path d="M12 7.6v.2"/>
{%- elif name == 'warning' -%}
  <path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5"/><path d="M12 17.3v.2"/>
{%- elif name == 'check' -%}
  <path d="M4.5 12.5l5 5 10-11"/>
{%- elif name == 'minus' -%}
  <path d="M5 12h14"/>
{%- elif name == 'plus' -%}
  <path d="M12 5v14M5 12h14"/>
{%- else -%}
  <circle cx="12" cy="12" r="8.5"/>
{%- endif -%}
</svg>
{%- endmacro %}
